<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25 formations — DIGITAL DZ</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DIGITAL <span>DZ</span></a><nav class="navlinks"><a href="index.html">Accueil</a><a class="active" href="formations-v5.html">Formations</a><a href="parcours-v5.html">Parcours</a><a href="defi-30-jours.html">Défi 30 jours</a><a href="espace-etudiant.html">Mon espace</a></nav></div></header><main class="section"><div class="container"><span class="eyebrow dark">CATALOGUE V5</span><h1>25 compétences pour apprendre, pratiquer et construire.</h1><p class="lead">Chaque parcours doit mener à une réalisation concrète : une offre, un contenu, un site, un tableau de bord, une boutique ou un portfolio.</p><input class="input search" id="courseSearch" oninput="filterCoursesV5()" placeholder="Rechercher une formation…"><div id="courses" class="grid"></div></div></main><script src="v5-data.js"></script><script>function render(){courses.innerHTML=DZ_COURSES.map(c=>`<a class="card" data-course-v5 href="${c[5]}"><span class="tag">${c[4]}</span><h3>${c[1]} ${c[2]}</h3><p>${c[3]}</p><b>Voir le parcours →</b></a>`).join('')}function filterCoursesV5(){let q=courseSearch.value.toLowerCase();document.querySelectorAll('[data-course-v5]').forEach(x=>x.classList.toggle('hidden',!x.innerText.toLowerCase().includes(q)))}render()</script></body></html>
