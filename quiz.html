<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — DIGITAL DZ</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DIGITAL <span>DZ</span></a><a href="espace-etudiant.html">← Espace étudiant</a></div></header><section class="section"><div class="container" style="max-width:800px"><h1>Quiz — Vente en ligne</h1><p class="lead">Teste tes connaissances. Ce quiz est un exemple de module d'évaluation.</p><form id="quiz"><div class="card"><h3>1. Quel est le rôle d'une fiche produit ?</h3><label class="check"><input type="radio" name="q1" value="1"> Présenter clairement le produit et aider le client à décider</label><label class="check"><input type="radio" name="q1" value="0"> Remplacer le service client</label></div><div class="card"><h3>2. Avant de publier une offre, il est utile de connaître :</h3><label class="check"><input type="radio" name="q2" value="1"> Le client cible et son besoin</label><label class="check"><input type="radio" name="q2" value="0"> Uniquement le nombre d'abonnés</label></div><button class="btn" type="submit">Corriger le quiz</button></form><div id="result"></div></div></section><script>document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();let s=0;document.querySelectorAll('input:checked').forEach(x=>s+=+x.value);document.getElementById('result').innerHTML='<div class="card" style="margin-top:20px"><h2>Résultat : '+s+'/2</h2><p>'+ (s===2?'Bravo, les bases sont acquises.':'Relis les modules puis réessaie.')+'</p></div>'})</script></body></html>
